[project]
name = "seam"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
defence = [
    "accelerate==1.4.0",
    "datasets==4.8.4",
    "lm-eval==0.4.11",
    "openai==1.77.0",
    "peft==0.14.0",
    "pyyaml==6.0.2",
    "torch==2.5.1",
    "tqdm==4.66.4",
    "transformers==4.49.0",
    "seaborn==0.13.2",
    "sentencepiece>=0.2,<0.3",
    "wandb==0.31.0",
]
attack = ["axolotl==0.18.0"]

[tool.uv]
default-groups = ["defence"]
conflicts = [
    [{ group = "defence" }, { group = "attack" }],
]
